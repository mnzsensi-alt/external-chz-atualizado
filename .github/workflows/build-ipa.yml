name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 3105 for iOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/3105.xcarchive/Products/Applications/3105.app"
          STAGING="$RUNNER_TEMP/ipa-staging"
          OUTPUT="$RUNNER_TEMP/3105-unsigned.ipa"

          test -d "$APP_PATH"
          mkdir -p "$STAGING/Payload"
          ditto "$APP_PATH" "$STAGING/Payload/3105.app"
          (cd "$STAGING" && ditto -c -k --sequesterRsrc --keepParent Payload "$OUTPUT")

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          unzip -t "$OUTPUT"
          echo "IPA_PATH=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
