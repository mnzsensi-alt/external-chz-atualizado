name: Build integrated test IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack prepared source
        run: |
          set -euo pipefail
          echo '4ddefc06663f0c0759f3e551a2eb779259441d6a99b64fcd48efae20079330cf  build-source.zip' | shasum -a 256 -c -
          mkdir integrated-source
          python3 -m zipfile -e build-source.zip integrated-source
      - name: Archive for iOS without signing
        working-directory: integrated-source
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/3105.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Verify bundled packages and package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/3105.xcarchive/Products/Applications/3105.app"
          export APP_PATH
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          app = Path(os.environ['APP_PATH'])
          records = json.loads(Path('integrated-source/integration-manifest.json').read_text())
          assert len(records) == 18
          for record in records:
              data = (app / 'BundledPatches' / record['filename']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == record['sha256'], record['filename']
          print('All 18 supplied packages are present and match their original hashes.')
          PY
          mkdir -p "$RUNNER_TEMP/ipa-staging/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa-staging/Payload/3105.app"
          (cd "$RUNNER_TEMP/ipa-staging" && ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/3105-integrada-sem-assinatura.ipa")
          unzip -t "$RUNNER_TEMP/3105-integrada-sem-assinatura.ipa"
          shasum -a 256 "$RUNNER_TEMP/3105-integrada-sem-assinatura.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: 3105-integrada-sem-assinatura
          path: ${{ runner.temp }}/3105-integrada-sem-assinatura.ipa
          if-no-files-found: error
          retention-days: 14
