name: inject chz - sem API
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compilar fontes locais sem API
        shell: bash
        run: bash compilar-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: inject-chz-sem-api
          path: dist/inject-chz-sem-api.ipa
          if-no-files-found: error
